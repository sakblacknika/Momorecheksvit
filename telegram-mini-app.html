<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ចេកស្អិត ដំណាប់ចេកខ្មែរ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@500;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#FFFBE0;--ink:#4A2A12;--muted:#7A5A44;--green:#1E6B34;--on-green:#FFF4B8;--banana:#F5C531;--line:#C9B76A;--card:#FFF4B8;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17130A;--ink:#FFF3D6;--muted:#CDBB93;--green:#3FA35A;--on-green:#10200F;--line:#5A4E2A;--card:#251F10}}
:root[data-theme="dark"]{--bg:#17130A;--ink:#FFF3D6;--muted:#CDBB93;--green:#3FA35A;--on-green:#10200F;--line:#5A4E2A;--card:#251F10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 "Noto Sans Khmer","DM Sans",system-ui,sans-serif;padding-bottom:170px}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
header{display:flex;gap:14px;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 0 14px}
header img{width:92px;border-radius:16px;flex:none}
h1{font-size:22px;line-height:1.5;margin:0;font-weight:800}
header p{margin:0;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:2px dotted var(--line)}
.row img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.nm{font-weight:800;font-size:16px;line-height:1.5}
.en{font:500 13px "DM Sans",sans-serif;color:var(--muted)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pr b{font:700 18px "DM Sans",sans-serif;color:var(--green)}
.st{display:flex;align-items:center;gap:6px}
.st button{width:36px;height:36px;border-radius:50%;border:2px solid var(--green);background:none;color:var(--green);font:700 20px/1 "DM Sans",sans-serif;cursor:pointer}
.st button.plus{background:var(--green);color:var(--on-green)}
.st span{min-width:24px;text-align:center;font:700 17px "DM Sans",sans-serif}
.info{margin:18px 0;padding:14px 16px;border-radius:16px;background:var(--card);font-size:14px}
.info a{color:var(--green);font-weight:800;text-decoration:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:520px;margin:0 auto}
label{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
label input{width:20px;height:20px;accent-color:var(--green)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:6px 0 10px}
.tot b{font-family:"DM Sans",sans-serif}
#send{width:100%;border:0;border-radius:99px;background:var(--green);color:var(--on-green);font:800 17px "Noto Sans Khmer","DM Sans",sans-serif;padding:12px;cursor:pointer}
#send:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,label:focus-within,a:focus-visible{outline:3px solid var(--banana);outline-offset:2px}
</style>
</head>

  ];
  var DELIVERY=8000,q=[0,0,0,0],tg=window.Telegram&&Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand();if(tg.colorScheme)document.documentElement.setAttribute('data-theme',tg.colorScheme)}catch(e){}}
  function f(n){return n.toLocaleString('en-US')+'៛'}
  var list=document.getElementById('list'),tot=document.getElementById('total'),btn=document.getElementById('send'),dv=document.getElementById('deliv');
  P.forEach(function(x,k){
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<img alt="" src="data:image/jpeg;base64,'+x.i+'"><div><div class="nm">'+x.n+'</div><div class="en">'+x.e+'</div><div class="pr"><b>'+f(x.p)+'</b><div class="st"><button type="button" aria-label="Remove one">−</button><span>0</span><button type="button" class="plus" aria-label="Add one">+</button></div></div></div>';
    var b=r.querySelectorAll('button'),s=r.querySelector('span');
    b[0].onclick=function(){if(q[k]>0){q[k]--;s.textContent=q[k];up()}};
    b[1].onclick=function(){q[k]++;s.textContent=q[k];up()};
    list.appendChild(r);
  });
  function sum(){return P.reduce(function(a,x,k){return a+x.p*q[k]},0)}
  function up(){var s=sum();tot.textContent=f(s+(s&&dv.checked?DELIVERY:0));btn.disabled=!s}
  dv.onchange=up;
  btn.onclick=function(){
    var t='សួស្តី! ខ្ញុំចង់កុម្ម៉ង់៖\n';
    P.forEach(function(x,k){if(q[k])t+='- '+x.n+' x'+q[k]+' = '+f(x.p*q[k])+'\n'});
    if(dv.checked)t+='ដឹកជូន: '+f(DELIVERY)+'\n';
    t+='សរុប: '+tot.textContent;
    var u='https://t.me/'+SELLER+'?text='+encodeURIComponent(t);
    if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank');
  };
  up();
